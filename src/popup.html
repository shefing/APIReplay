<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Replay</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-black dark:text-gray-100">
<div class="h-full flex flex-col">
    <div class="p-4 flex-grow overflow-auto">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">API Replay</h2>
            <button id="darkModeToggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-600" title="Toggle dark mode">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
                </svg>
            </button>
        </div>

        <div class="mb-3 flex gap-2">
            <button id="recordTabButton" class="tab-button tab-button-active px-3 py-1 rounded text-sm font-semibold" type="button">Record</button>
            <button id="replayTabButton" class="tab-button px-3 py-1 rounded text-sm font-semibold" type="button">Replay &amp; Preview</button>
        </div>

        <div id="statusIndicator" class="mb-2 p-1 bg-gray-200 dark:bg-gray-700 rounded text-center text-sm font-semibold"></div>

        <div id="recordTabPanel" class="tab-panel">
            <div class="mb-4">
                <div class="grid grid-cols-1 gap-2 mt-2">
                    <input type="text" id="recordingName" placeholder="Recording Name" class="p-1 text-sm border rounded dark:bg-gray-700" title="Display name for this recording session">
                    <div class="flex gap-2">
                        <input type="text" id="filter" placeholder="Filter (e.g., /api, /graphql, /v1)" class="p-1 text-sm border rounded dark:bg-gray-700 flex-1" title="Comma-separated URL fragments to record (for example: /api, /graphql, /v1). Any request URL containing one of these values is captured.">
                        <select id="presetSelect" class="p-1 text-sm border rounded dark:bg-gray-700" title="Apply a saved filter preset to the Filter field">
                            <option value="">No preset</option>
                        </select>
                        <button id="managePresets" class="bg-gray-500 text-white px-2 py-1 rounded text-xs" title="Create, edit, and delete reusable filter presets">Presets</button>
                    </div>
                    <button id="recordButton" class="bg-blue-500 text-white px-4 py-1 rounded text-sm" title="Start or stop recording">Start Recording</button>
                </div>
            </div>

            <div>
                <h3 class="text-base font-semibold mb-1">In-Progress Recorded URLs</h3>
                <p class="text-xs text-gray-600 dark:text-gray-300 mb-2">Live preview of captured requests for the selected recording.</p>
                <div id="recordApiPreview" class="bg-gray-100 dark:bg-gray-700 p-2 rounded text-sm">No recording selected</div>
            </div>
        </div>

        <div id="replayTabPanel" class="tab-panel hidden">
            <div class="mb-4">
                <div class="flex items-center justify-between mb-1">
                    <h3 class="text-base font-semibold">Select Recording</h3>
                    <div class="flex gap-1">
                        <button id="replayButton" class="bg-blue-500 text-white px-2 py-1 rounded text-xs" title="Start or stop replaying">Replay</button>
                        <div class="relative inline-block text-left">
                            <button id="exportImportDropdown" type="button" class="bg-blue-500 text-white px-2 py-1 rounded text-xs inline-flex items-center" aria-haspopup="true" aria-expanded="false" title="Open import/export actions for recordings">
                                File
                                <svg class="-mr-1 ml-2 h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                                </svg>
                            </button>
                            <div id="exportImportMenu" class="origin-top-right absolute right-0 mt-1 w-20 rounded-md shadow-lg bg-white dark:bg-gray-700 ring-1 ring-black ring-opacity-5 focus:outline-none hidden" role="menu" aria-orientation="vertical" aria-labelledby="exportImportDropdown">
                                <div class="py-1" role="none">
                                    <button id="renameRecording" class="text-white bg-blue-500 px-2 py-1 rounded text-xs w-full text-left hover:bg-blue-600 mb-1" role="menuitem" title="Rename the selected recording">Rename</button>
                                    <button id="duplicateRecording" class="text-white bg-blue-500 px-2 py-1 rounded text-xs w-full text-left hover:bg-blue-600 mb-1" role="menuitem" title="Create a copy of the selected recording">Duplicate</button>
                                    <button id="exportRecording" class="text-white bg-blue-500 px-2 py-1 rounded text-xs w-full text-left hover:bg-blue-600 mb-1" role="menuitem" title="Export the selected recording to JSON">Export</button>
                                    <button id="importRecording" class="text-white bg-blue-500 px-2 py-1 rounded text-xs w-full text-left hover:bg-blue-600 mb-1" role="menuitem" title="Import one recording from a JSON file">Import</button>
                                    <button id="exportAllRecordings" class="text-white bg-blue-500 px-2 py-1 rounded text-xs w-full text-left hover:bg-blue-600 mb-1" role="menuitem" title="Export all recordings as a single JSON file">Export All</button>
                                    <button id="importAllRecordings" class="text-white bg-blue-500 px-2 py-1 rounded text-xs w-full text-left hover:bg-blue-600" role="menuitem" title="Import multiple recordings from one JSON file">Import All</button>
                                </div>
                            </div>
                        </div>
                        <input type="file" id="importRecordingInput" accept=".json" class="hidden">
                        <input type="file" id="importAllRecordingsInput" accept=".json" class="hidden" multiple>
                        <div class="relative inline-block text-left">
                            <button id="deleteDropdown" type="button" class="bg-red-500 text-white px-2 py-1 rounded text-xs inline-flex items-center" aria-haspopup="true" aria-expanded="false" title="Open delete actions for the selected recording(s)">
                                Delete
                                <svg class="-mr-1 ml-2 h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                                </svg>
                            </button>
                            <div id="deleteMenu" class="origin-top-right absolute right-0 mt-1 w-15 rounded-md shadow-lg bg-white dark:bg-gray-700 ring-1 ring-black ring-opacity-5 focus:outline-none hidden" role="menu" aria-orientation="vertical" aria-labelledby="deleteDropdown">
                                <div class="py-1" role="none">
                                    <button id="deleteRecord" class="text-white bg-red-500 px-2 py-1 rounded text-xs w-full text-left hover:bg-red-600 mb-1" role="menuitem" title="Delete only the currently selected recording">Delete</button>
                                    <button id="removeAllRecordings" class="text-white bg-red-500 px-2 py-1 rounded text-xs w-full text-left hover:bg-red-600" role="menuitem" title="Permanently remove all recordings">Remove All</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="relative">
                    <div class="custom-select relative">
                        <input type="text" id="recordingSelect" placeholder="Search or select a recording" class="w-full p-1 text-sm border rounded dark:bg-gray-700" title="Search or select a recording to replay">
                        <div class="select-items select-hide"></div>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label class="flex items-center space-x-2" title="If enabled, replay can match by method + path/query even when host differs">
                    <input type="checkbox" id="fallbackMatching" class="form-checkbox" title="Match requests by method and path/query when exact URL host does not match">
                    <span>Enable fallback matching for similar paths</span>
                </label>
                <div class="grid grid-cols-2 gap-2 mt-2">
                    <input id="latencyMs" type="number" min="0" placeholder="Latency ms" class="p-1 text-sm border rounded dark:bg-gray-700" title="Optional fixed delay in milliseconds before each mocked response is returned">
                    <input id="latencyRange" type="text" placeholder="Range: min,max" class="p-1 text-sm border rounded dark:bg-gray-700" title="Optional random delay range in milliseconds as min,max (for example: 100,500)">
                </div>
                <div class="mt-2">
                    <label class="block text-xs font-semibold mb-1" for="urlMappings" title="Map recorded URL prefixes to different prefixes during replay. One mapping per line in the format: /from -> /to (for example: /microservice1/api -> /api)">URL Mappings (one per line: /from -&gt; /to)</label>
                    <textarea id="urlMappings" rows="3" placeholder="/microservice1/api -> /api" class="w-full p-1 text-sm border rounded dark:bg-gray-700 font-mono" title="Map recorded URL path prefixes to replay path prefixes. Format: /recorded-prefix -> /replay-prefix. Example: /microservice1/api -> /api"></textarea>
                </div>
            </div>

            <div id="replayStatsPanel" class="mb-4 p-2 rounded bg-gray-200 dark:bg-gray-700 text-xs hidden"></div>

            <div>
                <h3 class="text-base font-semibold mb-1">Captured Requests</h3>
                <input id="requestSearch" type="text" class="w-full p-1 mb-2 text-sm border rounded dark:bg-gray-700" placeholder="Search requests by URL/method/status" title="Filter API rows by URL, HTTP method, or response status">
                <div id="apiPreview" class="bg-gray-100 dark:bg-gray-700 p-2 rounded text-sm"></div>
            </div>
        </div>
    </div>
</div>

<div id="apiCallModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 p-4 rounded-lg w-full max-w-4xl h-[90vh] overflow-hidden flex flex-col border dark:border-gray-600">
        <h3 class="text-lg font-bold mb-2 dark:text-white">API Call Details</h3>
        <details class="mb-4">
            <summary class="cursor-pointer font-semibold dark:text-white">Request Details</summary>
            <div id="apiCallDetails" class="mt-2"></div>
        </details>
        <div class="flex-grow overflow-hidden flex flex-col">
            <strong class="dark:text-white mb-1">Response Body:</strong>
            <textarea id="responseBody" class="flex-grow w-full text-xs bg-gray-100 dark:bg-gray-700 p-2 rounded dark:text-white" title="Edit the mocked response body for this request. JSON is accepted and minified automatically on save."></textarea>
        </div>
        <div class="mt-4 flex justify-end">
            <button id="saveChanges" class="bg-green-500 text-white px-4 py-2 rounded mr-2" title="Save response-body edits for this request">Save Changes</button>
            <button id="closeModal" class="bg-red-500 text-white px-4 py-2 rounded" title="Close API call details">Close</button>
        </div>
    </div>
</div>

<div id="renameDialog" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 p-4 rounded-lg w-[90%] h-[220px] border dark:border-gray-600 flex flex-col space-y-4">
        <h3 class="text-lg font-bold mb-2 dark:text-white">Rename Recording</h3>
        <input type="text" id="newRecordingName" class="w-full p-2 mb-4 border rounded dark:bg-gray-700 dark:text-white flex-grow" placeholder="Enter new name" title="Set a new display name for the selected recording">
        <div class="flex justify-end mt-auto">
            <button id="cancelRename" class="bg-gray-500 text-white px-4 py-2 rounded mr-2" title="Cancel rename and keep the current recording name">Cancel</button>
            <button id="confirmRename" class="bg-blue-500 text-white px-4 py-2 rounded" title="Apply the new recording name">Rename</button>
        </div>
    </div>
</div>

<div id="presetsDialog" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 p-4 rounded-lg w-[95%] max-w-lg border dark:border-gray-600 flex flex-col space-y-3">
        <h3 class="text-lg font-bold dark:text-white">Manage Presets</h3>
        <input type="text" id="presetName" class="w-full p-2 border rounded dark:bg-gray-700 dark:text-white" placeholder="Preset name" title="Name used in the preset dropdown when selecting quick filter rules">
        <input type="text" id="presetFilter" class="w-full p-2 border rounded dark:bg-gray-700 dark:text-white" placeholder="Filter list (comma-separated)" title="Comma-separated path fragments to match request URLs (for example: /api, /graphql, /v1)">
        <div id="presetsList" class="max-h-48 overflow-auto text-sm"></div>
        <div class="flex justify-end">
            <button id="closePresets" class="bg-gray-500 text-white px-3 py-2 rounded mr-2" title="Close preset manager">Close</button>
            <button id="savePreset" class="bg-blue-500 text-white px-3 py-2 rounded" title="Save this preset for future use">Save Preset</button>
        </div>
    </div>
</div>

<script type="module" src="popup/main.ts"></script>
</body>
</html>
